name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Download and Setup BaseX
        run: |
          curl -s -O https://files.basex.org/releases/11.7/BaseX117.zip
          unzip -q BaseX117.zip
          cd basex/bin
          ./basex -c "ALTER PASSWORD admin admin"
          nohup ./basexhttp > basex.log 2>&1 &
          sleep 5

      - name: Map "basex" to "localhost"
        run: echo "127.0.0.1 basex" | sudo tee -a /etc/hosts

      - name: Verify BaseX is Running
        run: curl -s -I http://basex:8080/dba || (echo "BaseX HTTP server failed to start" && exit 1)

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
